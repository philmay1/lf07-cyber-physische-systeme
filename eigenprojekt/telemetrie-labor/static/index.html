<!doctype html>
<html lang="de" data-thema="boxenmauer">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telemetrie-Labor</title>
<!-- Symbol im Browser-Tab: kleine Zielflagge (als SVG direkt in der Adresse, keine eigene Datei). -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 4 4'%3E%3Crect width='4' height='4' fill='%23fff'/%3E%3Cpath d='M0 0h1v1H0zM2 0h1v1H2zM1 1h1v1H1zM3 1h1v1H3zM0 2h1v1H0zM2 2h1v1H2zM1 3h1v1H1zM3 3h1v1H3z'/%3E%3C/svg%3E">
<!-- Thema wählen, bevor die Seite gezeichnet wird (sonst blitzt kurz das falsche Thema auf).
     Reihenfolge: ?thema=... in der Adresse, sonst die letzte Wahl in diesem Browser, sonst Boxenmauer. -->
<script>
  (function () {
    var erlaubt = ['boxenmauer', 'ingenieur'];
    var aus_adresse = new URLSearchParams(location.search).get('thema');
    var gemerkt = null;
    try { gemerkt = localStorage.getItem('thema'); } catch (e) {}
    var thema = erlaubt.indexOf(aus_adresse) >= 0 ? aus_adresse : (erlaubt.indexOf(gemerkt) >= 0 ? gemerkt : 'boxenmauer');
    document.documentElement.dataset.thema = thema;
    try { localStorage.setItem('thema', thema); } catch (e) {}
  })();
</script>
<!-- Diagramm-Bibliothek uPlot und unser Design. Alles liegt lokal auf dem Pi, kein Internet nötig. -->
<link rel="stylesheet" href="/static/uPlot.min.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<!-- Kopfzeile: Name, Menü, Anmelden. -->
<header class="kopf">
  <a class="logo" href="#/"><span class="flagge"></span><span><b>Telemetrie-Labor</b><small>iRacing-Daten · ausgewertet auf dem Raspberry Pi 400</small></span></a>
  <nav class="menue">
    <a href="#/" data-seite="">Sitzungen</a>
    <a href="#/bestenliste" data-seite="bestenliste">Bestenliste</a>
    <a href="#/info" data-seite="info">So funktioniert's</a>
  </nav>
  <button id="login" class="zweit klein">Anmelden</button>
</header>
<!-- Statusleiste: app.js füllt sie alle 10 Sekunden mit Werten vom Pi (/api/system). -->
<div class="status" id="status"><span class="an">Pi verbinde ...</span></div>

<!-- Hier zeichnet app.js die jeweilige Seite hinein. -->
<main id="app"><p class="leise">Lade ...</p></main>

<!-- Anmelde-Fenster (versteckt, bis man auf "Anmelden" klickt). -->
<div id="loginFenster" class="fenster" hidden>
  <form id="loginForm" class="karte">
    <h3>Anmelden</h3>
    <p class="leise">Nötig zum Hochladen und Löschen. Ansehen geht ohne.</p>
    <input id="loginPasswort" type="password" placeholder="Passwort" autocomplete="current-password">
    <div class="zeile"><button type="submit">Anmelden</button><button type="button" id="loginAbbruch" class="zweit">Abbrechen</button></div>
    <p id="loginFehler" class="fehler"></p>
  </form>
</div>

<!-- Umschalter zwischen den beiden Design-Varianten (nur für die Vorschau). -->
<div class="themawahl" id="themawahl">
  <a href="?thema=boxenmauer" data-thema="boxenmauer">A · Boxenmauer</a>
  <a href="?thema=ingenieur" data-thema="ingenieur">B · Renningenieur</a>
</div>

<script src="/static/uPlot.iife.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
